[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gasm"
version = "0.1.0"
description = "RARE (real-time audio classification) and RASE (real-time audio separation), rewritten from the equations of Baelde (2019)"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    # appendix B.1/B.2 mixtures, maintained separately. 0.4.1 is the floor: the
    # two EM estimators do not separate their components before it
    "nongaussian-mixtures>=0.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "scipy-stubs"]
demos = ["soundfile>=0.12", "musdb>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/gasm"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
